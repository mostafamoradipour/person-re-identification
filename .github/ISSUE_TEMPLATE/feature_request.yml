name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What need would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change and any alternatives.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Data, model, or workflow impact
      description: Mention any new data, dependencies, performance, compatibility, or reproducibility considerations.
    validations:
      required: false
